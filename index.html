<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="背单词" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>背单词</title>
    <script>
      /* v119 暗色模式：在样式表之前落地主题，避免首屏白屏闪烁（FOUC）。
         与 app.js 的 THEME_STORAGE_KEY 保持一致；读不到时跟随系统。 */
      (function () {
        try {
          var t = localStorage.getItem("vocab-trainer-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest?v=137" />
    <link rel="icon" href="icons/icon-192.png?v=137" sizes="192x192" type="image/png" />
    <link rel="icon" href="icon.svg?v=137" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=137" />
    <link rel="stylesheet" href="style.css?v=137" />
  </head>
  <body class="focus-study">
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-card">
        <span class="splash-letter">A</span>
        <span class="splash-line"></span>
        <span class="splash-line short"></span>
      </div>
      <p class="splash-title">背单词</p>
    </div>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>背单词 <span class="version-badge" id="appVersion" title="当前版本">v—</span></h1>
        </div>
        <div class="header-actions">
          <div class="book-picker">
            <label for="bookSelect">单词本</label>
            <select id="bookSelect"></select>
          </div>
          <button class="icon-button" id="refreshButton" title="刷新网页" aria-label="刷新网页">
            <span aria-hidden="true">↻</span>
          </button>
          <button class="icon-button" id="themeToggle" title="切换到暗色" aria-label="切换到暗色">
            <span aria-hidden="true">☾</span>
          </button>
          <button class="data-button" id="dataButton" title="数据管理" aria-label="数据管理">
            <span aria-hidden="true">⇅</span>
            <span>数据</span>
          </button>
        </div>
      </header>

        <section class="stats-strip" aria-label="学习统计">
          <div class="stat-item">
            <span class="stat-label">今日待复习</span>
            <strong id="dueCount">0</strong>
            <small class="stat-note" id="dueTotalCount">今日共到期 0</small>
          </div>
        <div class="stat-item">
          <span class="stat-label">词库总数</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">掌握词数</span>
          <strong id="masteredCount">0</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">今日正确率</span>
          <strong id="accuracyToday">0%</strong>
        </div>
      </section>

      <nav class="tabs" aria-label="主导航">
        <button class="tab is-active" data-view="studyView">复习</button>
        <button class="tab" data-view="libraryView">词库</button>
        <button class="tab" data-view="submitView">共建</button>
        <button class="tab" data-view="progressView">进度</button>
      </nav>

      <main>
        <section id="studyView" class="view is-active">
          <div class="study-controls">
            <div class="control-chip">
              <label for="queueType">队列</label>
              <select id="queueType">
                <option value="due">今日复习</option>
                <option value="unmastered">未掌握单词</option>
                <option value="mastered">已掌握单词</option>
                <option value="new">未学单词</option>
                <option value="all">全部混合</option>
                <option value="wrong">错词优先</option>
              </select>
            </div>
            <div class="control-chip">
              <label for="reviewLimit">每日复习量</label>
              <select id="reviewLimit">
                <option value="50">50 个</option>
                <option value="100">100 个</option>
                <option value="150">150 个</option>
                <option value="200">200 个</option>
              </select>
            </div>
            <div class="control-chip control-chip-toggle">
              <label for="autoAudioToggle">自动发音</label>
              <input type="checkbox" id="autoAudioToggle" aria-label="打开后每张单词卡自动朗读单词" />
            </div>
          </div>

          <section class="review-stage" aria-live="polite">
              <div class="review-card is-empty" id="reviewCard">
                <div class="review-head">
                  <p class="queue-label" id="queueLabel"></p>
                </div>
                <div class="review-body" id="reviewBody">
                  <div class="prompt-line">
                    <h2 id="promptText">轻点任意处开始</h2>
                    <button class="audio-button prompt-audio-button is-hidden" id="promptAudioButton" type="button" title="播放发音" aria-label="播放发音">
                      <span aria-hidden="true">🔊</span>
                    </button>
                  </div>
                  <p class="prompt-hint" id="promptHint"></p>
                  <p class="reveal-hint" id="showAnswerButton"></p>
                </div>
                <div class="review-reveal">
                  <div class="answer-box is-hidden" id="answerBox">
                    <span id="answerText"></span>
                  </div>
                  <p class="feedback" id="feedbackText"></p>
                </div>
                <div class="review-actions">
                  <button class="rate-button medium" data-rating="medium">模糊</button>
                  <button class="rate-button mastered" data-rating="mastered">掌握</button>
                  <button class="rate-button hard" data-rating="hard">忘了</button>
                  <button class="rate-button easy" data-rating="easy">记住</button>
                </div>
              </div>
            </section>
        </section>

        <section id="libraryView" class="view">
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="搜索单词或释义" />
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="new">未学</option>
              <option value="learning">学习中</option>
              <option value="mastered">已掌握</option>
              <option value="wrong">错词</option>
              <option value="stubborn">顽固词</option>
            </select>
          </div>
          <p class="legend" aria-label="状态图例">
            <span class="legend-item"><i class="status-dot new"></i>未学</span>
            <span class="legend-item"><i class="status-dot learning"></i>学习中</span>
            <span class="legend-item"><i class="status-dot wrong"></i>错词</span>
            <span class="legend-item"><i class="status-dot mastered"></i>已掌握</span>
            <span class="legend-item"><i class="status-dot mastered-strong"></i>完全掌握</span>
          </p>

          <div class="library-layout">
            <section class="word-list" id="wordList" aria-label="词库列表"></section>
            <aside class="editor-panel">
              <h2>添加单词</h2>
              <form id="addWordForm">
                <label>
                  单词
                  <input id="newTerm" required />
                </label>
                <label>
                  释义
                  <input id="newMeaning" required />
                </label>
                <label>
                  例句
                  <textarea id="newExample" rows="3"></textarea>
                </label>
                <button class="primary-button" type="submit">添加</button>
              </form>
              <h2>批量导入</h2>
              <textarea id="bulkImport" rows="6" placeholder="每行：word, 释义"></textarea>
              <button class="ghost-button wide" id="importButton">导入</button>
            </aside>
          </div>
        </section>

        <section id="submitView" class="view">
          <div class="submit-layout">
            <section class="submit-panel">
              <h2>提交词本</h2>
              <form id="submitForm" class="submit-form">
                <label>
                  词本名称
                  <input id="submitBookName" required maxlength="80" autocomplete="off" />
                </label>
                <label>
                  邮箱
                  <input id="submitEmail" type="email" required maxlength="120" autocomplete="email" />
                </label>
                <label>
                  TXT 文件
                  <input id="submitFile" type="file" accept=".txt,text/plain" required />
                </label>
                <button class="primary-button" id="submitButton" type="submit">提交审核</button>
                <p class="subtle-text" id="submitHint">只接收 .txt 原始文件，提交后进入待审核目录。</p>
                <p class="submit-status" id="submitStatus" role="status" aria-live="polite"></p>
              </form>
            </section>
          </div>
        </section>

        <section id="progressView" class="view">
          <div class="progress-grid">
            <div class="progress-panel">
              <h2>记忆分布</h2>
              <div class="bars" id="levelBars"></div>
            </div>
            <div class="progress-panel">
              <h2>最近记录</h2>
              <div class="history-list" id="historyList"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- v129 沉浸态顶栏：左=本次学习计时，中=队列进度，右=今日正确率环；退出按钮移到底部居中 -->
    <div class="immersive-bar" id="immersiveBar">
      <span class="immersive-timer" id="immersiveTimer" title="本次学习时长">
        <span class="immersive-timer-icon" aria-hidden="true">⏱</span>
        <span id="immersiveTimerText">0:00</span>
      </span>
      <span class="immersive-label" id="immersiveLabel">复习中</span>
      <div class="rate-ring" id="rateRing" title="今日正确率" aria-label="今日正确率">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle class="rate-ring-track" cx="18" cy="18" r="15.5"></circle>
          <circle class="rate-ring-value" id="rateRingValue" cx="18" cy="18" r="15.5"></circle>
        </svg>
        <span class="rate-ring-text" id="rateRingText">--</span>
      </div>
    </div>

    <div class="immersive-exit-bar" id="immersiveExitBar">
      <button class="immersive-exit-button" id="immersiveExitButton" type="button">退出全屏背词</button>
    </div>

    <!-- v134：点单词复制到剪贴板后的小提示 -->
    <div class="copy-toast" id="copyToast" role="status" aria-live="polite"></div>

    <div class="data-sheet is-hidden" id="dataSheet" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
      <div class="data-panel">
        <button class="icon-button close-button" id="closeDataSheet" aria-label="关闭">
          <span aria-hidden="true">×</span>
        </button>
        <h2 id="dataTitle">数据管理</h2>
        <section class="sync-section" aria-labelledby="syncTitle">
          <h3 id="syncTitle">跨设备同步</h3>
          <label class="sync-code-label" for="syncCodeInput">同步码</label>
          <div class="sync-code-row">
            <input
              id="syncCodeInput"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX"
            />
            <button class="ghost-button" id="copySyncCodeButton" type="button" disabled>复制</button>
          </div>
          <div class="sync-actions">
            <button class="primary-button" id="createSyncCodeButton" type="button">生成同步码</button>
            <button class="ghost-button" id="connectSyncButton" type="button">连接</button>
            <button class="ghost-button" id="syncNowButton" type="button" disabled>立即同步</button>
            <button class="ghost-button" id="disconnectSyncButton" type="button" disabled>断开</button>
          </div>
          <p class="submit-status" id="syncStatus" role="status" aria-live="polite">未连接</p>
        </section>

        <section class="backup-section" aria-labelledby="backupTitle">
          <h3 id="backupTitle">本地备份</h3>
          <p>导出会保存当前设备的全部词本、进度和复习记录。导入会覆盖当前本地数据。</p>
          <div class="data-actions">
            <button class="primary-button" id="exportBackupButton" type="button">导出备份</button>
            <button class="ghost-button" id="importBackupButton" type="button">导入备份</button>
          </div>
          <input id="backupInput" class="is-hidden" type="file" accept=".json,application/json" />
          <p class="backup-note" id="dailyStatsInfo" role="status" aria-live="polite"></p>
          <p class="submit-status" id="dataStatus" role="status" aria-live="polite"></p>
        </section>

        <section class="backup-section" aria-labelledby="todayQueueTitle">
          <h3 id="todayQueueTitle">今日队列</h3>
          <p>按当前进度重建今天的复习队列，并把进度归零。只影响「今天先复习哪些词」，不会改动学习进度和复习记录。</p>
          <div class="data-actions">
            <button class="ghost-button" id="resetTodayQueueButton" type="button">重建今日队列</button>
          </div>
          <p class="submit-status" id="todayQueueStatus" role="status" aria-live="polite"></p>
        </section>
      </div>
    </div>

    <button class="meaning-bulk-button is-hidden" id="toggleAllMeaningsButton" type="button">全部显示</button>

    <script src="submission-config.js?v=137"></script>
    <script src="cloud-sync.js?v=137"></script>
    <script src="core-book-data.js?v=137"></script>
    <script src="cet4-book-data.js?v=137"></script>
    <script src="cet6-book-data.js?v=137"></script>
    <script src="app.js?v=137"></script>
  </body>
</html>
